name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # Java 21 para el emulador de Firestore (tests de reglas).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: |
          npm ci
          npm --prefix functions ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Tests web
        run: npm test

      - name: Build y tests de Functions
        run: |
          npm --prefix functions run build
          npm --prefix functions test

      - name: Tests de reglas de Firestore
        run: npm run test:rules

      - name: Build PWA
        run: npm run build
